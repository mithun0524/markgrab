<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkGrab — Store Screenshots</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 40px 20px; }
  header { max-width: 1320px; margin: 0 auto 28px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  header .sub { color: #94a3b8; font-size: 14px; margin-left: auto; }
  .grid { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
  figure { background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 32px rgba(0,0,0,.4); }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 18px; font-size: 13px; color: #94a3b8; display: flex; justify-content: space-between; }
  svg { flex: none; }
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 512 512"><rect x="16" y="16" width="480" height="480" rx="104" fill="#2563eb"/><g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"><path d="M104 356 V180 L196 288 L288 180 V356"/><path d="M384 168 V320"/></g><path d="M340 300 L384 360 L428 300 Z" fill="#fff"/></svg>
  <h1>MarkGrab — Store Screenshots</h1>
  <span class="sub">1280 × 800</span>
</header>
<div class="grid">
  <figure><img src="1-hero.png" alt="Hero"><figcaption><span>1 — Hero</span><span>Copy any page as clean Markdown</span></figcaption></figure>
  <figure><img src="2-structure.png" alt="Structure"><figcaption><span>2 — Structure</span><span>Tables &amp; code survive</span></figcaption></figure>
  <figure><img src="3-chat.png" alt="Chat"><figcaption><span>3 — Chat</span><span>Full chat transcripts</span></figcaption></figure>
</div>
</body>
</html>
